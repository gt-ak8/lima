# cc-dev: full-fat dev VM with Claude Code and the async tech stack.
# Inherits the shared base (common CLI toolkit, git identity, shell wiring)
# and adds the dev-stack on top.
#
# @@BASE@@ is a placeholder replaced by the justfile with an absolute file://
# URL to base/base.yaml (Lima rejects `../` in relative locators, and `--set`
# happens after base merging so it can't inject the locator).
#
# Base provisions are PREPENDED to ours by Lima merging, so the order is:
#   base system -> dev-stack-system -> base user -> dev-stack-user
base:
  - "@@BASE@@"

# Claude native installer allocates ~3.5 GiB RSS (Bun mmaps a large heap).
# 4 GiB OOM-killed it during provisioning; 8 GiB is comfortable.
memory: "8GiB"

# cc-dev adds HOST_PATH on top of the GIT_* params declared in the base.
param:
  HOST_PATH: ""

ssh:
  # Pin the host port forwarded to the guest's sshd:22.
  # Without this, Lima picks a random free port on each start, breaking
  # `ssh lima-cc-dev` (the lima-managed ssh.config is regenerated, but any
  # cached known_hosts entries / scripted ports go stale).
  localPort: 2222

mounts:
  # Mirror the host path inside the guest so absolute paths (logs, tool
  # output, IDE jumps) resolve identically on both sides.
  - location: "{{ .Param.HOST_PATH }}"
    mountPoint: "{{ .Param.HOST_PATH }}"
    writable: true

provision:
  - mode: system
    file: ./scripts/dev-system-deps.sh
  - mode: user
    file: ./scripts/dev-user-setup.sh
